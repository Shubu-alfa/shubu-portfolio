{% extends "layout2.html" %}
{% block title %}Login - ShubhzAIFolio{% endblock %}
{% block content %}
<div class="auth-card" id="top">
    <h1 class="h3">Admin login</h1>
    <p class="text-muted">Required for private projects such as Trading.</p>
    {% if error %}
    <div class="alert alert-danger" role="alert">{{ error }}</div>
    {% endif %}
    <form method="post" action="{{ url_for('login') }}">
        <input type="hidden" name="next" value="{{ next_url or '' }}">
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" class="form-control" id="password" name="password" required autofocus autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-primary btn-block">Sign in</button>
    </form>
</div>
{% endblock %}
